<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple bookmark manager built with HTML, CSS and JavaScript.">
    <title>Bookmark Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header>
            <p class="eyebrow">MY WEB TOOL</p>
            <h1>Bookmark Manager</h1>
            <p class="subtitle">Keep your useful links organised in one simple place.</p>
        </header>

        <section class="add-bookmark" aria-labelledby="add-title">
            <h2 id="add-title">Add a bookmark</h2>
            <form id="bookmarkForm">
                <input id="bookmarkName" type="text" placeholder="Bookmark name" aria-label="Bookmark name" required>
                <input id="bookmarkUrl" type="url" placeholder="https://example.com" aria-label="Bookmark URL" required>
                <button type="submit">Add Bookmark</button>
            </form>
        </section>

        <section aria-labelledby="saved-title">
            <div class="section-heading">
                <h2 id="saved-title">Saved bookmarks</h2>
                <button id="clearBookmarks" class="secondary" type="button">Clear all</button>
            </div>
            <div id="bookmarkList" class="bookmark-grid" aria-live="polite"></div>
            <p id="emptyState" class="empty">No bookmarks yet. Add your first one above.</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
